
name: Build LAND METRICS iOS

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Generate iOS project if missing
        run: |
          if [ ! -d ios ]; then
            flutter create \
              --org com.landmetrics \
              --project-name landmetrics \
              --platforms ios .
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check iOS configuration
        run: |
          flutter --version
          xcodebuild -version
          echo "Checking iOS project..."
          ls -la ios

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build LAND METRICS iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS application
        uses: actions/upload-artifact@v4
        with:
          name: land-metrics-ios-build
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
