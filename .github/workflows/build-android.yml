name: Build LAND METRICS Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --org com.landmetrics --project-name landmetrics --platforms android .

      - name: Add internet permission
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: land-metrics-apk
          path: build/app/outputs/flutter-apk/app-release.apk
