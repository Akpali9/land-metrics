name: Build LAND METRICS Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Project
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create \
              --org com.landmetrics \
              --project-name landmetrics \
              --platforms android .
          fi

      - name: Configure Internet Permission
        run: |
          grep -q 'android.permission.INTERNET' \
          android/app/src/main/AndroidManifest.xml || \
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' \
          android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Android App Icons
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Generate Splash Screen
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter Project
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LAND-METRICS-ANDROID-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
