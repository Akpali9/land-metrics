name: Build LAND METRICS Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --org com.landmetrics --project-name landmetrics --platforms android,ios .

      - name: Android permissions and minimum SDK
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in INTERNET POST_NOTIFICATIONS; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\"/>\n    <application#" $M
          done
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true

      - run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Read Firebase config (optional)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" > /tmp/gs.json
            echo "FB_API_KEY=$(jq -r '.client[0].api_key[0].current_key' /tmp/gs.json)" >> $GITHUB_ENV
            echo "FB_APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' /tmp/gs.json)" >> $GITHUB_ENV
            echo "FB_SENDER=$(jq -r '.project_info.project_number' /tmp/gs.json)" >> $GITHUB_ENV
            echo "FB_PROJECT=$(jq -r '.project_info.project_id' /tmp/gs.json)" >> $GITHUB_ENV
          fi

      - name: Build APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter build apk --release
          --dart-define=SENTRY_DSN=$SENTRY_DSN
          --dart-define=FIREBASE_API_KEY=$FB_API_KEY
          --dart-define=FIREBASE_APP_ID=$FB_APP_ID
          --dart-define=FIREBASE_SENDER_ID=$FB_SENDER
          --dart-define=FIREBASE_PROJECT_ID=$FB_PROJECT

      - uses: actions/upload-artifact@v4
        with:
          name: land-metrics-apk
          path: build/app/outputs/flutter-apk/app-release.apk
