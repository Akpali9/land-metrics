name: Build LAND METRICS Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create Android project files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org com.landmetrics \
              --project-name landmetrics \
              --platforms android,ios .
          else
            echo "Existing Android project preserved."
          fi

      - name: Force AGP 9.3.2 to avoid Lint crash
        run: |
          # 1) Try settings.gradle / settings.gradle.kts (modern Flutter template)
          SETTINGS_FILE=$(find android -maxdepth 2 -name "settings.gradle*" | head -1)
          if [ -n "$SETTINGS_FILE" ]; then
            echo "Found settings file: $SETTINGS_FILE"
            sed -i -E 's/(com\.android\.application"?\s+version\s+")[0-9.]+(")/\19.3.2\2/' "$SETTINGS_FILE"
            grep -n "com.android.application" "$SETTINGS_FILE" || true
          else
            echo "No settings.gradle found; will try build.gradle below."
          fi

          # 2) Also patch legacy android/build.gradle classpath if present
          if [ -f android/build.gradle ]; then
            sed -i -E "s#(classpath\s+'com\.android\.tools\.build:gradle:)[0-9.]+(')#\19.3.2\2#" android/build.gradle
            grep -n "com.android.tools.build:gradle" android/build.gradle || true
          fi

          # 3) Ensure Gradle wrapper is new enough for AGP 9.3.2 (requires >= 9.5.0)
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$WRAPPER" ]; then
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-all.zip#' "$WRAPPER"
            echo "--- gradle-wrapper.properties ---"
            cat "$WRAPPER"
          fi

      - name: Configure Android permissions and SDK
        run: |
          M=android/app/src/main/AndroidManifest.xml

          for P in INTERNET POST_NOTIFICATIONS; do
            grep -q "android.permission.$P" "$M" || \
            sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\"/>\n    <application#" "$M"
          done

          sed -i \
            's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' \
            android/app/build.gradle* || true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub deps

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Read Firebase configuration
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" > /tmp/gs.json

            echo "FB_API_KEY=$(jq -r '.client[0].api_key[0].current_key' /tmp/gs.json)" >> $GITHUB_ENV
            echo "FB_APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' /tmp/gs.json)" >> $GITHUB_ENV
            echo "FB_SENDER=$(jq -r '.project_info.project_number' /tmp/gs.json)" >> $GITHUB_ENV
            echo "FB_PROJECT=$(jq -r '.project_info.project_id' /tmp/gs.json)" >> $GITHUB_ENV
          fi

      - name: Build release APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build apk --release \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=FIREBASE_API_KEY="$FB_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FB_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FB_SENDER" \
            --dart-define=FIREBASE_PROJECT_ID="$FB_PROJECT"

      - name: Upload LAND METRICS APK
        uses: actions/upload-artifact@v4
        with:
          name: land-metrics-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
