name: landmetrics
description: LAND METRICS - buy and sell verified land and property.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.9.1
  file_picker: ^10.3.3
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

  
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#04513A"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter_native_splash:
  color: "#04513A"
  image: assets/splash.png
